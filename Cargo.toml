[workspace]
members = ["crates/core", "app/src-tauri"]
# The app needs its UI built first (npm run build:ui in app/), so plain
# `cargo test` covers the core alone.
default-members = ["crates/core"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Sam Williams"]
publish = false

[profile.release]
lto = true
codegen-units = 1

# The time-lock is far too slow to test unoptimized. Overflow checks stay on.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
